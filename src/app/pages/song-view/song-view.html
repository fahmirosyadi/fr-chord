<div
  class=""
  (swipeleft)="nextPart()"
  (swiperight)="prevPart()">
  <div class="">
    @if (youtubeEmbedUrl) {
      <div class="col-span-3">
        <iframe
          width="100%"
          height="150"
          [src]="youtubeEmbedUrl"
          title="YouTube video player"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>
    }
    <div class="grid grid-cols-4 gap-2" style="width: 300px; margin-top: 20px; margin-bottom: 20px;">
      <button mat-raised-button (click)="song.transpose(-1)">-</button>
      <button mat-raised-button disabled="">{{song.tmpCurrentKey}}</button>
      <button mat-raised-button (click)="song.transpose(1)">+</button>
      <button mat-raised-button disabled="">{{song.getTransposeValue()}}</button>
    </div>
		<mat-card class="metronome" aria-label="Song metronome">
      <strong>Metronome</strong>
      <button mat-stroked-button aria-label="Decrease tempo" (click)="changeTempo(-1)">−</button>
      <span class="tempo-value">{{ song.bpm }} BPM · {{ song.timeSignatureNumerator }}/{{ song.timeSignatureDenominator }}</span>
      <button mat-stroked-button aria-label="Increase tempo" (click)="changeTempo(1)">+</button>
      <button mat-flat-button color="primary" (click)="toggleMetronome()">
        {{ metronomeRunning ? 'Stop' : 'Start' }}
      </button>
      <span class="beat-indicator" aria-live="polite">
        @for (beat of beatNumbers; track beat) {
          <span [class.active]="currentBeat === beat">{{ beat }}</span>
        }
      </span>
		</mat-card>
		<mat-card class="col-span-1 lg-col-span-3" id="desktop-preview">
      <app-song-preview [song]="song"></app-song-preview>
      <div id="score"></div>
		</mat-card>
