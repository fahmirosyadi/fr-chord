<div
  class="">
  <div class="">

    <!-- Back -->
    <div style="margin-bottom: 20px;">

      <button
        style="width: 100%;"
        mat-stroked-button
        (click)="backToSetlist()">
        {{ playlist.name }}
      </button>

    </div>

    <div class="" style="margin-bottom: 20px;">
      <div class="grid grid-cols-2 gap-2">
        <button
          mat-stroked-button
          (click)="previousSong()">

          <mat-icon>chevron_left</mat-icon>
        </button>
        <button
          mat-stroked-button
          (click)="nextSong()">

          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>
    <app-song-view [song]="(playlist.playlistSong || [])[currentIndex].song"></app-song-view>
    <div class="" style="margin-top: 20px;">
      <div class="grid grid-cols-2 gap-2">
        <button
          mat-stroked-button
          (click)="previousSong()">

          <mat-icon>chevron_left</mat-icon>
        </button>
        <button
          mat-stroked-button
          (click)="nextSong()">

          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
