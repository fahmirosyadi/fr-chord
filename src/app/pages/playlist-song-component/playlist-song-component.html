<div class="">


  <!-- SEARCH -->

	<div class="title-bar">

    <div class="title">
      {{ playlist.name }}
    </div>
    <div class="actions" style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
      @if (isLoggedIn) {
        <button
          mat-icon-button
          (click)="toggleEditMode()"
          [attr.aria-label]="isEditMode ? 'Done editing' : 'Edit setlist'">

          <mat-icon>
            {{ isEditMode ? 'check' : 'swap_vert' }}
          </mat-icon>

        </button>
        <button
          mat-icon-button
          (click)="addSong()"
          [attr.aria-label]="'Add song to setlist'">

          <mat-icon>
            add
          </mat-icon>

        </button>
        <button
          mat-icon-button
          (click)="toggleDeleteMode()"
          [attr.aria-label]="isDeleteMode ? 'Done deleting' : 'Delete song from setlist'">

          <mat-icon>
            {{ isDeleteMode ? 'check' : 'delete' }}
          </mat-icon>

        </button>
      }
    </div>

	</div>

	<!-- SONG LIST -->

	<div class="song-list" cdkDropList
    (cdkDropListDropped)="onDrop($event)">

		@for (song of playlist.playlistSong; track song.song.id; let i = $index) {

      <div
        class="song-item"
        (click)="view(song.song.id)"
        cdkDrag
        [cdkDragDisabled]="!isLoggedIn || !isEditMode"
        matRipple>

        <!-- DRAG HANDLE -->

        @if (isEditMode) {
          <div
            class="drag-handle"
            cdkDragHandle
            (click)="$event.stopPropagation()">

            <mat-icon>drag_indicator</mat-icon>

          </div>
        }
        @if (isDeleteMode) {
          <button
            mat-icon-button
            class="delete-button"
            (click)="deleteSong($event, song.song.id)"
            aria-label="Delete song">

            <mat-icon>
              delete
            </mat-icon>

          </button>

        }

        <div class="song-number">
          {{ i + 1 }}
        </div>

        <div class="song-content">

          <div class="title">
            {{ song.song.title }} {{ song.song.key ? '(' + song.song.key + ')' : '' }}
          </div>

          <div class="artist">
            {{ song.song.artist }}
          </div>

        </div>

      </div>

    }

	</div>

</div>
