<div class="reset-password-container">
  <mat-card class="reset-password-card">
    <mat-card-title>Set a new password</mat-card-title>
    <mat-card-content>
      <form (ngSubmit)="reset()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required minlength="6" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm new password</mat-label>
          <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required minlength="6" />
        </mat-form-field>

        @if (errorMessage) {
          <mat-error>{{ errorMessage }}</mat-error>
        }
        @if (successMessage) {
          <p class="success-message">{{ successMessage }}</p>
          <a routerLink="/login">Go to login</a>
        } @else {
          <button mat-raised-button color="primary" type="submit" [disabled]="saving">
            {{ saving ? 'Updating...' : 'Update password' }}
          </button>
        }
      </form>
    </mat-card-content>
  </mat-card>
</div>
