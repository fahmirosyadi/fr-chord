<div class="">

	<!-- SEARCH -->

	<div class="search-bar">

		<mat-icon>search</mat-icon>

		<input
			type="text"
			placeholder="Search songs..."
			[(ngModel)]="search"
			(input)="onSearch(search)"
		/>

	</div>

	<!-- SONG LIST -->

	<div class="song-list">

		@if (loading) {

			<div class="loading">
				Loading...
			</div>

		} @else {

			@for (song of data; track song.id; let i = $index) {

        <div
          class="song-item"
          (click)="viewSong(song)"
          matRipple>

          <div class="song-number">
            {{ i + 1 }}
          </div>

          <div class="song-content">

            <div class="title">
              {{ song.title }} {{ song.key ? '(' + song.key + ')' : '' }}
            </div>

            <div class="artist">
              {{ song.artist }}
            </div>

          </div>

        </div>

      }

		}

	</div>

</div>
