<div class="">

	<!-- SEARCH -->

	<div class="search-bar">

		<mat-icon>search</mat-icon>

		<input
			type="text"
			placeholder="Search songs..."
			[(ngModel)]="search"
			(input)="onSearch2(search)"
		/>

	</div>


	<!-- SONG LIST -->

	<div class="song-list">

		@if (loading) {

			<div class="loading">
				Loading...
			</div>

		} @else {

			@for (song of data; track song.id; let i = $index) {

				<div
					class="song-item"
					matRipple
					(click)="viewSong(song)">

					@if (isAddMode) {

						<mat-checkbox
							[checked]="isSongAdded(song.id!)"
							(click)="$event.stopPropagation()"
							(change)="toggleSong(song)">
						</mat-checkbox>

					} @else {

						<div class="song-number">
							{{ i + 1 }}
						</div>

					}


					<div class="song-content">

						<div class="title">
							{{ song.title }}
							{{ song.key ? '(' + song.key + ')' : '' }}
						</div>

						<div class="artist">
							{{ song.artist }}
						</div>

					</div>


					@if (!isAddMode) {

						<mat-icon class="arrow">
							chevron_right
						</mat-icon>

					}

				</div>

			}

		}

	</div>

</div>
